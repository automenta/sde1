[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sde"
version = "0.2.0"
description = "A Scientific Discovery Engine for accelerated ML research."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
    { name = "SDE Contributor", email = "contributor@example.com" }
]
keywords = ["machine learning", "research", "automation", "visualization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "PyQt6",
    "pyqtgraph",
    "torch",
    "torchvision",
    "numpy",
    "platformdirs",
    "scikit-learn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[project.gui-scripts]
sde-ui = "sde.run_ui:main"

[project.urls]
Homepage = "https://github.com/example/sde"
Repository = "https://github.com/example/sde"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sde = ["**"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
