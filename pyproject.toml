[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sde"
version = "0.1.0"
description = "Scientific Discovery Engine"
readme = "README.md"
requires-python = ">=3.8"

[tool.setuptools.packages.find]
where = ["."]
include = ["sde*"]
exclude = ["tests*"]
